# Apache config for the cook-off on cogsciresearch.vassar.edu.
# Installed as /etc/httpd/conf.d/eyetracking-cookoff.conf (see scripts/deploy-vassar.sh).
#
# Scoped to the experiment's own directory: the other sites under /var/www/html, including the rest of jdeleeuw/, are
# untouched. .htaccess files are ignored on this server (AllowOverride None), so the headers
# have to live here.
<Directory "/var/www/html/jdeleeuw/eyetracking-cookoff">
    # Cross-origin isolation. It gives the page SharedArrayBuffer, and with it a multi-threaded
    # CPU encoder. Every cross-origin resource the page loads (unpkg, jsDelivr, Google Storage,
    # DataPipe) already allows it; checked 2026-09-28.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Revalidate on every load, so participants get a new deploy at once, not a cached old one.
    Header always set Cache-Control "no-cache"

    # A module script served as anything but JavaScript is refused; wasm streams only as wasm.
    AddType text/javascript .mjs
    AddType application/wasm .wasm
</Directory>
