<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>deferred encoder check</title>
    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #16181c;
        color: #e8e3d9;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 {
        font-size: 1.2rem;
        font-weight: 500;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Deferred encoder check</h1>
    <p>
      The no-WebGPU path, with no camera: the real worker, the real wasm session, the real
      queueing, the crop cap and the real write-back into a jsPsych dataset. Slow on purpose — it is
      measuring a wasm encode.
    </p>
    <pre id="out">running…</pre>

    <script src="../lib/saccade/core.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/encoding.js"></script>
    <script src="../js/webgazer-features.js"></script>
    <script src="../js/deferred-embedder.js"></script>
    <script src="../js/dual-recorder.js"></script>

    <script type="module">
      const lines = [];
      let failures = 0;
      const out = document.getElementById("out");
      const log = (t) => {
        lines.push(t);
        out.textContent = lines.join("\n");
      };
      const check = (name, ok, detail) => {
        if (!ok) failures++;
        log(`${ok ? "PASS" : "FAIL"}  ${name}${detail ? "  " + detail : ""}`);
      };

      const E = window.CookoffEncoding;
      const CROP_LEN = 144 * 36;
      const crop = (seed) => {
        const c = new Uint8Array(CROP_LEN);
        for (let i = 0; i < CROP_LEN; i++) c[i] = (i * 37 + seed * 11) % 256;
        return c;
      };

      const embedder = new DeferredEmbedder({
        workerUrl: "../js/embed-worker.js",
        modelUrl: new URL("../lib/saccade/eye_embedding.onnx", location.href).href,
        ortUrl: `https://cdn.jsdelivr.net/npm/onnxruntime-web@${Saccade.ORT_VERSION}/dist/ort.bundle.min.mjs`,
        wasmDir: `https://cdn.jsdelivr.net/npm/onnxruntime-web@${Saccade.ORT_VERSION}/dist/`,
      });

      log("booting the worker and loading the model…");
      const identity = await embedder.init();
      check("the worker loads the model", identity.dim === 128, `dim ${identity.dim}, weight output ${identity.emitsWeight}`);
      check("the model is the published release",
        identity.sha256 && identity.sha256.length === 64, `sha256 ${String(identity.sha256).slice(0, 12)}…`);

      log("measuring a wasm encode…");
      const ms = await embedder.measure(3);
      log(`one encode costs ${ms.toFixed(0)} ms on this machine (wasm, one thread)`);

      const d = CookoffConfig.design;
      const expectedFrames = Math.round((30 * (d.settle_duration + d.capture_duration)) / 1000);

      /*
       * The recorder's side of the glue, driven without a camera.
       *
       * `record` and `pack` are the shipped prototype methods called on a bare object, so this
       * checks the real queueing and the real packing rather than a description of them. Only
       * the fields those two touch are present.
       */
      const fakeRecorder = {
        embedder,
        embeddingDim: 128,
        fps: 30,
        stats: { frames: 0, faceMissing: 0, dropped: 0, errors: 0 },
        buffer: null,
        lastFrame: null,
        onFrame: null,
        beginCapture: DualRecorder.prototype.beginCapture,
        record: DualRecorder.prototype.record,
        pack: DualRecorder.prototype.pack,
        packCommon: DualRecorder.prototype.packCommon,
      };
      const fakeStage = (i) => ({
        time: { capture: 1000 + i * 33.3, source: "captureTime", dropped: 0 },
        faceFound: true,
        crop: crop(i),
        wg: {
          left: new Uint8ClampedArray(60),
          right: new Uint8ClampedArray(60),
          boxes: { left: { x: 1, y: 2, width: 3, height: 4 }, right: { x: 5, y: 6, width: 7, height: 8 } },
        },
        head: new Float32Array(27),
        ear: new Float32Array(2),
      });

      // Every frame is queued, the arrival (settle) included: saccade latency needs it.
      const N_FRAMES = 30;
      fakeRecorder.beginCapture({ stationId: 99 });
      for (let i = 0; i < N_FRAMES; i++) fakeRecorder.record(fakeStage(i), null, null);
      const packed = fakeRecorder.pack(fakeRecorder.buffer, 1000);

      check("the recorder keeps every frame for WebGazer", packed.n_frames === N_FRAMES,
        `${packed.n_frames} frames`);
      check("the recorder queues every frame, the first included",
        packed.embedded_frames.length === N_FRAMES && packed.embedded_frames.every((f, k) => f === k),
        `${packed.embedded_frames.length} of ${N_FRAMES} queued`);
      check("the embedding fields are left for the embedder to fill",
        packed.saccade_embedding === null && packed.saccade_weight === null);
      check("WebGazer's streams are full length",
        E.decodeU8(packed.webgazer_gray_left, 60).length === N_FRAMES &&
          E.decodeU8(packed.webgazer_eye_box, 16).length === N_FRAMES);
      // Those went into the embedder's store; clear it so the station test below is clean.
      embedder.stations.delete(99);
      embedder.queue = embedder.queue.filter((q) => q.stationId !== 99);

      /*
       * The crop cap, without a worker: stations whose frames were queued and never reached.
       * Past `maxCrops` the crops kept are spread evenly over all of them, and the rest counted.
       */
      {
        const capped = new DeferredEmbedder({});
        const capPsych = initJsPsych({});
        const STATIONS = 10, PER = 20, CAP = 50;
        for (let s = 0; s < STATIONS; s++) {
          capPsych.data.get().push({ trial_type: "cookoff-capture", station_id: 1000 + s });
          for (let i = 0; i < PER; i++) capped.submit(1000 + s, i, crop(i));
        }
        capped.queue = []; // no workers: nothing is ever reached
        const capSummary = capped.finalize(capPsych, true, CAP);
        const perStation = capPsych.data.get().values().map((r) => (r.crop_frames || []).length);
        check("the crop cap keeps exactly maxCrops",
          capSummary.asCrops === CAP && capSummary.cropsDropped === STATIONS * PER - CAP,
          `${capSummary.asCrops} kept, ${capSummary.cropsDropped} dropped`);
        check("the kept crops are spread over every station",
          perStation.every((n) => n === CAP / STATIONS), `[${perStation.join(", ")}]`);
        const uncapped = new DeferredEmbedder({});
        const freePsych = initJsPsych({});
        freePsych.data.get().push({ trial_type: "cookoff-capture", station_id: 2000 });
        for (let i = 0; i < PER; i++) uncapped.submit(2000, i, crop(i));
        uncapped.queue = [];
        const free = uncapped.finalize(freePsych, true, CAP);
        check("under the cap every crop is kept", free.asCrops === PER && free.cropsDropped === 0,
          `${free.asCrops} kept`);
      }

      // A fake station, every frame queued.
      const jsPsych = initJsPsych({});
      const frameT = Array.from({ length: expectedFrames }, (_, i) => Math.round(i * 33.3 * 10) / 10);
      const queued = [];
      for (let i = 0; i < expectedFrames; i++) queued.push(i);

      jsPsych.data.get().push({
        trial_type: "cookoff-capture",
        station_id: 0,
        n_frames: expectedFrames,
        frame_t: frameT,
        embedded_frames: queued.slice(),
        saccade_embedding: null,
        saccade_weight: null,
        crop_frames: null,
        saccade_crop: null,
      });

      log(`\nqueueing ${queued.length} crops…`);
      for (const i of queued) embedder.submit(0, i, crop(i));
      check("everything queued is pending", embedder.pending() > 0, `${embedder.pending()} in the queue`);

      // Deliberately short, so the leftover path is exercised rather than described.
      const deadline = Math.max(1200, ms * Math.max(1, Math.floor(queued.length / 2)));
      log(`draining with a ${Math.round(deadline)} ms deadline (short on purpose)…`);
      const drained = await embedder.drain(deadline, (left, total) => {
        out.textContent = lines.join("\n") + `\n  ${total - left} of ${total} encoded…`;
      });
      log(`drained: ${embedder.encoded} encoded, ${drained.left} still queued${drained.timedOut ? " (hit the deadline)" : ""}`);

      const summary = embedder.finalize(jsPsych);
      const row = jsPsych.data.get().filter({ station_id: 0 }).values()[0];

      const embeddings = row.saccade_embedding ? E.decodeF16(row.saccade_embedding, 128) : [];
      const crops = row.saccade_crop ? E.decodeU8(row.saccade_crop, CROP_LEN) : [];

      check("every queued frame is accounted for, as an embedding or as a crop",
        row.embedded_frames.length + (row.crop_frames ? row.crop_frames.length : 0) === queued.length,
        `${row.embedded_frames.length} embedded + ${row.crop_frames ? row.crop_frames.length : 0} crops = ${queued.length} queued`);
      check("the embedding blob has one row per embedded frame",
        embeddings.length === row.embedded_frames.length, `${embeddings.length} rows`);
      check("the weight blob has one row per embedded frame",
        E.decodeF16(row.saccade_weight, 1).length === row.embedded_frames.length);
      check("the crop blob has one row per leftover frame",
        crops.length === (row.crop_frames ? row.crop_frames.length : 0), `${crops.length} rows`);
      check("embedded and leftover frames do not overlap",
        !(row.crop_frames || []).some((i) => row.embedded_frames.includes(i)));
      check("every recorded frame index is one that was queued",
        [...row.embedded_frames, ...(row.crop_frames || [])].every((i) => queued.includes(i)));
      check("the embeddings are real numbers",
        embeddings.length > 0 && embeddings[0].every(Number.isFinite),
        embeddings.length ? `first value ${embeddings[0][0].toFixed(4)}` : "none");
      check("a leftover crop survives the round trip byte for byte",
        crops.length === 0 || crops[0].every((v, i) => v === crop(row.crop_frames[0])[i]));

      // The write-back has to land in the dataset, not only in the object we happen to hold.
      const serialised = JSON.parse(jsPsych.data.get().json()).find((r) => r.station_id === 0);
      check("the write-back reaches the serialised dataset",
        serialised.saccade_embedding === row.saccade_embedding &&
          serialised.embedded_frames.length === row.embedded_frames.length);

      const perStationKB =
        ((row.saccade_embedding || "").length + (row.saccade_crop || "").length) / 1024;
      log(`\none station costs ${perStationKB.toFixed(1)} KB with ${summary.embedded} embedded and ${summary.asCrops} as crops`);
      log(`(an all-embedded station is about 3.5 KB; an all-crop one about 220 KB)`);

      embedder.dispose();
      lines.unshift(failures === 0 ? `${lines.length} checks passed\n` : `${failures} CHECK(S) FAILED\n`);
      out.textContent = lines.join("\n");
      window.deferredCheck = { failures, encodeMs: ms };
    </script>
  </body>
</html>
